# The security headers, in one place.
#
# nginx only inherits `add_header` from the enclosing level when the current
# level declares none of its own. Every location in nginx.conf sets a
# Cache-Control, so headers declared once at server level were silently
# dropped from every real response. This file is therefore *included inside
# each location* (and once at server level for anything that has none).
#
# The same values are set at Cloudflare for apidoc.ansmusic.io; keep the two
# in step. `style-src 'unsafe-inline'` is for the handful of style=""
# attributes in index.html; scripts get no such allowance.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
