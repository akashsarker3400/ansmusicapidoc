server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers live in one file and are included in EVERY location:
    # a location with its own add_header does not inherit the server's.
    include /etc/nginx/snippets/security-headers.conf;

    # The page changes rarely and the assets carry no hash, so the page is
    # revalidated every time and the assets are cached for a day.
    location = / { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location = /index.html { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache"; }
    location = /openapi.yaml { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache"; add_header Content-Disposition 'attachment; filename="ans-music-partner-api.yaml"'; types { } default_type application/yaml; }
    location /assets/ { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "public, max-age=86400"; }
    location ~* \.(css|js)$ { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800"; }

    location = /healthz { include /etc/nginx/snippets/security-headers.conf; add_header Content-Type text/plain; return 200 "ok\n"; }

    # Anything else is the one page — old anchors and typos land on it.
    location / { include /etc/nginx/snippets/security-headers.conf; try_files $uri $uri/ /index.html; }

    gzip on;
    gzip_types text/html text/css application/javascript application/yaml text/plain image/svg+xml;
    gzip_min_length 1024;
}
